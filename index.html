<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Jeremy N. Martin</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
</head>
<body>
    <canvas id="plexus-canvas" aria-hidden="true"></canvas>
    <main>
        <h1 class="title">
            <span>Jeremy N. Martin</span>
            <span class="emblem" data-emblem role="img" aria-label="jnm.app" title="jnm.app"></span>
        </h1>

        <section aria-labelledby="about-heading">
            <h2 id="about-heading">À propos</h2>
            <ul class="link-list">
                <li>
                    <a class="link-card" href="https://www.linkedin.com/in/jeremy-n-martin/" target="_blank" rel="noopener noreferrer">
                        <span class="paint-icon" data-paint-icon="linkedin"><img src="images/links/linkedin.svg" alt="" width="40" height="40"></span>
                        <span>
                            <strong>LinkedIn</strong>
                            <small>Profil professionnel</small>
                        </span>
                    </a>
                </li>
            </ul>
        </section>

        <section aria-labelledby="works-heading">
            <h2 id="works-heading">Travaux</h2>
            <ul class="link-list">
                <li>
                    <a class="link-card" href="/jeux/">
                        <span class="paint-icon" data-paint-icon="jeux"><img src="images/links/jeux.svg" alt="" width="40" height="40"></span>
                        <span>
                            <strong class="vt-jeux">Jeux</strong>
                            <small>Des mondes à explorer, des énigmes à résoudre</small>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="link-card" href="https://cabinetduplateau.fr/" target="_blank" rel="noopener noreferrer">
                        <span class="paint-icon" data-paint-icon="cabinetduplateau"><img src="images/links/cabinetduplateau.svg" alt="" width="40" height="40"></span>
                        <span>
                            <strong>Cabinet du Plateau</strong>
                            <small>Professionnels de santé</small>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="link-card" href="https://metamachia.com/" target="_blank" rel="noopener noreferrer">
                        <span class="paint-icon" data-paint-icon="metamachia"><img src="images/links/metamachia.svg" alt="" width="40" height="40"></span>
                        <span>
                            <strong>Metamachia</strong>
                            <small>Recherche, IA et systèmes complexes</small>
                        </span>
                    </a>
                </li>
                <li>
                    <a class="link-card" href="https://fantasiafauna.com/" target="_blank" rel="noopener noreferrer">
                        <span class="paint-icon" data-paint-icon="fantasiafauna"><img src="images/links/fantasiafauna.svg" alt="" width="40" height="40"></span>
                        <span>
                            <strong>Fantasia Fauna</strong>
                            <small>Bestiaire fantasy</small>
                        </span>
                    </a>
                </li>
            </ul>
        </section>
    </main>
    <script src="script.js" defer></script>
    <script src="assets/emblem.js" defer></script>
    <script src="assets/paint-icons.js" defer></script>
</body>
</html>
